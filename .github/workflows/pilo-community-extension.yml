name: Pilo Community Extension

on:
  pull_request:
    branches:
      - pilo-v1.2.3
  push:
    branches:
      - pilo-v1.2.3
    tags:
      - "v*-pilo.*"

permissions:
  contents: read

concurrency:
  group: pilo-community-extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Validate and build Pilo frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CI_IMAGE: pilo-plane-frontend:ci
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1

      - name: Enable Corepack
        run: |
          corepack enable
          corepack install --global pnpm@10.30.2
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Intake template contract
        run: node --test apps/web/ce/components/inbox/intake-templates/registry.test.mjs

      - name: Validate changed source formatting
        run: >-
          pnpm exec oxfmt --check
          apps/web/core/components/inbox/modals/create-modal/create-root.tsx
          "apps/web/core/components/account/terms-and-conditions.tsx"
          "apps/web/app/(all)/[workspaceSlug]/(projects)/star-us-link.tsx"
          apps/web/ce/components/inbox/intake-templates/index.ts
          apps/web/ce/components/inbox/intake-templates/registry.ts
          apps/web/ce/components/inbox/intake-templates/registry.test.mjs
          apps/web/ce/components/inbox/intake-templates/selector.tsx
          apps/web/ce/constants/pilo-fork.d.mts
          apps/web/ce/constants/pilo-fork.mjs
          apps/web/core/components/inbox/modals/create-modal/modal.tsx
          packages/constants/src/tab-indices.ts
          packages/ui/src/button/toggle-switch.tsx
          package.json
          PILO_FORK.md
          README.md
          .github/workflows/pilo-community-extension.yml

      - name: Typecheck frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm turbo run check:types --filter=web

      - name: Lint Pilo extension source
        run: >-
          pnpm exec oxlint --deny-warnings
          "apps/web/app/(all)/[workspaceSlug]/(projects)/star-us-link.tsx"
          apps/web/core/components/account/terms-and-conditions.tsx
          apps/web/core/components/inbox/modals/create-modal/create-root.tsx
          apps/web/core/components/inbox/modals/create-modal/modal.tsx
          apps/web/ce/components/inbox/intake-templates/index.ts
          apps/web/ce/components/inbox/intake-templates/registry.ts
          apps/web/ce/components/inbox/intake-templates/registry.test.mjs
          apps/web/ce/components/inbox/intake-templates/selector.tsx
          apps/web/ce/constants/pilo-fork.mjs
          packages/constants/src/tab-indices.ts
          packages/ui/src/button/toggle-switch.tsx

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/web/Dockerfile.web
          build-args: PILO_SOURCE_REVISION=${{ github.sha }}
          load: true
          platforms: linux/amd64
          provenance: false
          push: false
          tags: ${{ env.CI_IMAGE }}

      - name: Scan production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.CI_IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          timeout: 15m0s

  publish-release:
    name: Publish signed-source Pilo frontend
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_IMAGE: ghcr.io/pilodevelopment/plane-frontend:${{ github.ref_name }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/web/Dockerfile.web
          build-args: PILO_SOURCE_REVISION=${{ github.sha }}
          platforms: linux/amd64
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ env.RELEASE_IMAGE }}

      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.RELEASE_IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          timeout: 15m0s
